name: Release Obsidian theme

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(jq -r .version manifest.json)"

          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match manifest.json version $version"
            exit 1
          fi

          gh release create "$tag" --title "$tag" --generate-notes manifest.json theme.css
